name: ci
on: [push, pull_request]
jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest -q tests
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cd app && swift build -c release
